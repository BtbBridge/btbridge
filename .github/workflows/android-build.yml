name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android-client/gradlew

      - name: Run Unit Tests and Build Debug APK
        working-directory: android-client
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Copy APK to workspace root
        run: cp android-client/app/build/outputs/apk/debug/app-debug.apk BTBridge.apk

      - name: Upload BTBridge.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTBridge-APK
          path: BTBridge.apk
